<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Endpoints</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 5px;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            color: #333;
        }

        #endpoint-list {
            list-style-type: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap; /* Allows the items to wrap to the next line */
            gap: 10px;
        }
        .endpoint-item {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            flex: 1 1 calc(20% - 10px); /* Adjust the width to fit 4 items per row */
            box-sizing: border-box; /* Ensures padding and border are included in the element's total width and height */
            background-color: #fff; /* Optional: Adds a background color for visibility */
        }
        .endpoint-item a {
            text-decoration: none;
            color: #007BFF;
            font-weight: bold;
        }
        .form-container {
            margin-top: 10px;
        }
        input[type="number"], input[type="text"], input[type="date"], select {
            margin: 5px;
            padding: 5px;
            width: 150px;
        }
        button {
            padding: 5px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .autocomplete-suggestions {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #ddd;
            background-color: white;
            position: absolute;
            width: 180px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
<h1>API Endpoints</h1>

<div>
    <form>

            <input type="number" name="size" id="size" value="500" placeholder="size">
            <input type="date" name="date" id="date" class="date-field">
            <input type="date" name="start_date" id="start_date" placeholder="start_date" class="date-field">
            <input type="date" name="end_date" id="end_date" placeholder="end_date" class="date-field">
        </div>
    </form>
    <div class="autocomplete-suggestions"></div>
</div>
<ul id="endpoint-list"></ul>
</body>

    // Function to create and append list items
    function createEndpointList() {
        const endpointList = document.getElementById('endpoint-list');
        Object.keys(endpoints).forEach(endpoint => {
            const listItem = document.createElement('li');
            listItem.classList.add('endpoint-item');
            const link = document.createElement('a');
            link.href = '#';
            link.textContent = endpoint;
            link.onclick = () => openEndpoint(endpoint);
            listItem.appendChild(link);
            endpointList.appendChild(listItem);
        });
    }
    function openEndpoint (endpoint) {
        const params = endpoints[endpoint] ?? []
        const keyVal = params.map(p => `${p}=${document.getElementById(p).value}`)
        if (keyVal.length > 0) {
            window.open(`${endpoint}?${keyVal.join('&')}`, '_blank')
        } else {
            window.open(endpoint, '_blank')
        }
    }
    function autocompleteCompany(event) {
        const inputField = event.target;
        const suggestionsDiv = document.querySelector('.autocomplete-suggestions');
        const query = inputField.value.toLowerCase();
        suggestionsDiv.innerHTML = '';
        suggestionsDiv.style.display = 'none';
        if (query.length > 0) {
            const filteredCompanies = companies.filter(company =>
                company.companyName.toLowerCase().includes(query) ||
                company.symbol.toLowerCase().includes(query) ||
                company.id.toString().includes(query)
            );
            if (filteredCompanies.length > 0) {
                suggestionsDiv.style.display = 'block';
                filteredCompanies.forEach(company => {
                    const suggestion = document.createElement('div');
                    suggestion.classList.add('autocomplete-suggestion');
                    suggestion.textContent = `${company.companyName} (${company.symbol}) - ID: ${company.id}`;
                    suggestion.onclick = () => selectCompany(company, inputField);
                    suggestionsDiv.appendChild(suggestion);
                });
            }
        }
    }
    function selectCompany(company, inputField) {
        const companyIdField = document.querySelector('.company-id');
        inputField.value = company.id;
        companyIdField.value = company.id;
        document.querySelector('.autocomplete-suggestions').style.display = 'none';
    }
    // Fetch the market open data and set the date
    window.onload = function() {
        fetch('/market-open')
            .then(response => response.json())
            .then(data => {
                const marketOpenDate = data.asOf.split('T')[0]; // Extract date part from the 'asOf' field (YYYY-MM-DD)
                // Set the value for all date fields with the class 'date-field'
                const dateFields = document.querySelectorAll('.date-field');
                dateFields.forEach(dateField => {
                    dateField.value = marketOpenDate;
                });
            })
            .catch(error => {
                console.error('Error fetching market open data:', error);
            });
    }
    createEndpointList()
